# The recovered sources import AndroidX directly (tools/migrate_androidx.py),
# and no dependency still ships against the old support library, so
# Jetifier is off.
android.useAndroidX=true
android.enableJetifier=false

# Decompiled code has many raw-type warnings, generic inference quirks, and
# unused symbols. Don't fail the build on them.
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# JVM + Gradle execution. Machine-specific proxy and daemon settings belong in
# ~/.gradle/gradle.properties; keeping them out of the project avoids duplicate
# keys and prevents local proxy hosts from breaking CI and contributor builds.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
