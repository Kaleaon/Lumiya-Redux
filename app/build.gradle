// App module for the recovered Lumiya viewer.
//
// The decompiled `android.support.*` imports were rewritten to AndroidX by
// tools/migrate_androidx.py, and no dependency is built against the old
// support library any more, so Jetifier is off (root gradle.properties).

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def originalBytecodeList = rootProject.file('tools/recover/bytecode_classes.txt')
def originalBytecodeClasses = originalBytecodeList.exists()
    ? originalBytecodeList.readLines().collect { it.trim() }.findAll { it && !it.startsWith('#') }
    : []

android {
    namespace 'com.lumiyaviewer.lumiya'
    compileSdk 34

    def javaCompatVersion = JavaVersion.VERSION_1_8

    defaultConfig {
        applicationId 'com.lumiyaviewer.lumiya'
        minSdk 26            // cleanup baseline: API 26+ only (notification channels,
                             // scoped runtime behavior, and removal of pre-Oreo
                             // compatibility branches)
        targetSdk 34
        versionCode 66
        versionName '3.4.2'

        // Drop mips / mips64 — Android removed MIPS support in NDK r17 (2018);
        // the shipped APK included them but modern toolchains cannot rebuild them.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }

        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false   // lumiya-3.4.2 shipped without R8/Proguard name
                                  // obfuscation; preserve that for now so the
                                  // decompiled→rebuilt stack traces stay readable.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility javaCompatVersion
        targetCompatibility javaCompatVersion
    }

    kotlinOptions {
        jvmTarget = javaCompatVersion.toString()
    }

    // The decompilation holds a lot of raw types, unchecked casts, and dead
    // symbols that jadx couldn't erase. Don't block builds on them.
    testOptions {
        unitTests.includeAndroidResources = true
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
        // AGP 8.7's UnsafeIntentLaunch detector crashes while analyzing the
        // recovered NfcSensor receiver; keep the rest of lint enabled.
        disable 'UnsafeIntentLaunch', 'UnspecifiedRegisterReceiverFlag'
    }
    packagingOptions {
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE*',
            'META-INF/NOTICE*',
            'META-INF/*.kotlin_module',
            'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
        ]
        jniLibs {
            useLegacyPackaging = true   // Lumiya loads its .so files on old APIs too
        }
    }

    // Pin every resource that existed in Lumiya 3.4.2 to its original id
    // (generated from recovered/android/res/values/public.xml). Original
    // bytecode linked from libs/lumiya-original-classes.jar and any id literal
    // a decompiler left behind then point at the right resource.
    androidResources {
        additionalParameters += ['--stable-ids', file('stable-ids.txt').absolutePath]
    }

    // Keep the shipped native libs (librawbuf.so, libopenjpeg.so, libgvr.so)
    // in src/main/jniLibs/<abi>/. Cleanup gate: remove libgvr.so only after
    // Cardboard/OpenXR parity lands and rollout confidence is confirmed.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Classes whose recovered source does not yet reproduce the
            // original bytecode ship as that original bytecode instead
            // (tools/recover/legacy/build_legacy_jar.sh). Their .java files
            // stay in the tree as the work-in-progress recovery but are not
            // compiled. Remove a line from bytecode_classes.txt once
            // tools/verify/dexdiff.py reports the source version as OK.
            java.exclude originalBytecodeClasses.collect { "${it}.java" }
        }
    }
}

def kotlinPreferredPackageRoots = [
    'com/lumiyaviewer/lumiya/vr/runtime',
    'com/lumiyaviewer/lumiya/repository',
    'com/lumiyaviewer/lumiya/data'
]

tasks.register('enforceKotlinFirstPackages') {
    group = 'verification'
    description = 'Static check that prevents new Java sources in packages declared Kotlin-first for modernization.'

    doLast {
        def kotlinPreferredJavaFiles = fileTree("$projectDir/src/main/java") {
            include kotlinPreferredPackageRoots.collect { "${it}/**/*.java" }
        }

        def trackedJavaFiles = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'ls-tree', '-r', '--name-only', 'HEAD', 'src/main/java'
            standardOutput = trackedJavaFiles
        }

        def trackedJavaPathSet = trackedJavaFiles
            .toString('UTF-8')
            .readLines()
            .findAll { it.endsWith('.java') }
            .toSet()

        def newJavaFilesInKotlinRoots = kotlinPreferredJavaFiles.files.findAll { file ->
            def repoRelativePath = project.relativePath(file)
            !trackedJavaPathSet.contains(repoRelativePath)
        }

        if (!newJavaFilesInKotlinRoots.isEmpty()) {
            throw new GradleException(
                "Kotlin-first package policy violation. New files in ${kotlinPreferredPackageRoots} must be Kotlin (.kt). Existing Java files remain allowed until they are touched for feature/bug work. " +
                    "Found new Java files: ${newJavaFilesInKotlinRoots*.absolutePath}"
            )
        }
    }
}

tasks.register('rejectUndecompiledMethods') {
    group = 'verification'
    description = 'Fails when viewer-owned source still contains a JADX method-not-decompiled stub.'

    doLast {
        def offenders = fileTree("$projectDir/src/main/java") {
            include 'com/lumiyaviewer/lumiya/**/*.java'
            include 'uk/co/senab/photoview/**/*.java'
        }.files.findAll { sourceFile ->
            sourceFile.getText('UTF-8').contains('Method not decompiled')
        }

        if (!offenders.isEmpty()) {
            throw new GradleException("Unrecovered production methods: ${offenders*.absolutePath}")
        }
    }
}

tasks.named('check').configure {
    dependsOn(tasks.named('enforceKotlinFirstPackages'))
    dependsOn(tasks.named('rejectUndecompiledMethods'))
}

tasks.named('lint').configure {
    dependsOn(tasks.named('enforceKotlinFirstPackages'))
}

tasks.withType(JavaCompile).configureEach {
    // The decompilation warns on every other line; turn the noise down so
    // real problems are visible.
    options.compilerArgs += ['-Xlint:none', '-Xmaxwarns', '10', '-Xmaxerrs', '100000']
    options.encoding = 'UTF-8'
}

// -------------------------------------------------------------------------
//  Dependencies — modern, Maven-resolved replacements for every third-party
//  Java package that jadx dumped into the decompilation (and which we have
//  since deleted from app/src/main/java).
//
//  Where the original package name is preserved upstream we pin to that
//  package's own coordinate; where upstream has renamed, Jetifier handles
//  the remap (android.support → androidx).
// -------------------------------------------------------------------------
dependencies {
    if (!originalBytecodeClasses.isEmpty()) {
        implementation files('libs/lumiya-original-classes.jar')
    }
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'

    // ── AndroidX. The decompiled `android.support.*` imports were rewritten
    //    to these packages by tools/migrate_androidx.py. Versions are the
    //    newest that still build against compileSdk 34. The legacy-support-v4
    //    and -v13 umbrellas are replaced by the modules the code imports
    //    (swiperefreshlayout, loader, drawerlayout, coordinatorlayout).
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // ── Room (parallel persistence migration) ──
    // Target end-state persistence runtime.
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ── Square ──
    // OkHttp 4 keeps the `okhttp3` package and the Java-facing API the
    // recovered code uses (3.x has been unmaintained since 2021). It brings
    // Okio 3 transitively; nothing imports okio directly.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ── greenDAO ──
    // Transitional dependency. Remove after Room migration reaches full
    // entity/query parity and schema migration validation is complete.
    // 2.2.1 preserves the legacy `de.greenrobot.dao.*` package that the
    // decompilation imports. (3.x renamed the runtime to
    // `org.greenrobot.greendao`, which would require a find-replace across
    // ~80 DAO + ORM files.)
    implementation 'de.greenrobot:greendao:2.1.0'

    // ── PhotoView ──
    // The `uk.co.senab.photoview` package was discontinued in 2016 when
    // chrisbanes renamed to `com.github.chrisbanes.photoview`. No reliable
    // Maven drop-in exists for the old package name, so the decompiled
    // PhotoView sources live in-tree under uk/co/senab/photoview/.
    // Migrate to `com.github.chrisbanes:PhotoView:2.3.0` and rewrite
    // TextureViewFragment.java to use `PhotoViewAttacher(ImageView)` when
    // you get to that cleanup.


    // ── Google libraries ──
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.google.guava:guava:33.3.1-android'   // Lumiya uses
                                                            // guava eventbus,
                                                            // cache, collect,
                                                            // io, net, util.
    implementation 'com.google.code.findbugs:jsr305:3.0.2'   // javax.annotation

    // ── Google VR / Cardboard ──
    // GVR SDK was deprecated in 2019 and Google removed the artifacts from
    // their Maven repo in 2021. The decompiled GVR Java sources therefore
    // remain in-tree under com/google/vr/ and com/google/vrtoolkit/, and
    // libgvr.so is shipped in src/main/jniLibs/<abi>/.
    // Cleanup gate: remove these in-tree packages and libgvr.so only after
    // Cardboard/OpenXR parity + rollout confidence.
    // Long-term migration target: the open-source Google Cardboard SDK
    // (https://github.com/googlevr/cardboard) — but that's a native-first
    // rewrite of the VR activities, so it's a separate project.

    testImplementation 'junit:junit:4.13.2'
    // Robolectric runs resource-level checks (layout inflation under the
    // app theme) on the JVM; see LayoutInflationTest.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
