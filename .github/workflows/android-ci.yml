name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# A new commit makes an older run for the same PR obsolete. Cancelling it keeps
# runner time focused on the revision that can actually be merged.
concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy `tools` SDK package is no longer published. Declare the
          # supported package explicitly so setup does not request it.
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Compile and verify the app
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleDebug
          :app:check

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumiya-debug-${{ github.event.pull_request.number || github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.event.pull_request.number || github.run_number }}
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
