pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // PhotoView: `com.github.chrisbanes:PhotoView` (Baseflow-maintained fork,
        // package `com.github.chrisbanes.photoview`) is only published on JitPack.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = 'Lumiya-Redux'
include ':app'
